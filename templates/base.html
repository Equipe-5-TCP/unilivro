<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UniLivro{% endblock %}</title>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

<nav class="navbar">
    <a href="/meus-livros" class="nav-brand">
        <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="UniLivro" class="nav-logo">
    </a>
    <div class="nav-links">
        <a href="/meus-livros" class="nav-link">Meus Livros</a>
        <a href="/cadastrar-livro" class="nav-link nav-add">+ Adicionar</a>
        <div class="nav-divider"></div>

        <span class="nav-user-name" id="nav-user"></span>

        <button onclick="logout()" class="btn-logout">Sair</button>
    </div>
</nav>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">
            <span>{{ message }}</span>
            <button onclick="this.parentElement.remove()">×</button>
        </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<main>
    {% block content %}{% endblock %}
</main>


</body>
</html>
